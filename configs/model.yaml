models:
  llama-3.1-8b:
    path: models/llama-3.1-8b
    family: llama
    torch_dtype: bfloat16
    device_map: auto
  llama-3.1-8b-instruct:
    path: models/llama-3.1-8b-instruct
    family: llama
    torch_dtype: bfloat16
    device_map: auto
  qwen2.5-7b:
    path: models/qwen2.5-7b
    family: qwen
    torch_dtype: bfloat16
    device_map: auto
  mistral-7b:
    path: models/mistral-7b
    family: llama
    torch_dtype: bfloat16
    device_map: auto
  llama-3.2-3b:
    path: models/llama-3.2-3b
    family: llama
    torch_dtype: bfloat16
    device_map: auto
  yi-1.5-9b:
    path: models/yi-1.5-9b
    family: llama
    torch_dtype: bfloat16
    device_map: auto
  falcon3-7b:
    path: models/falcon3-7b
    family: llama
    torch_dtype: bfloat16
    device_map: auto
  # Larger scaling-study model; same Llama-style architecture, no pipeline changes.
  mistral-nemo-12b:
    path: models/mistral-nemo-12b
    family: llama
    torch_dtype: bfloat16
    device_map: auto

tokenizer:
  trust_remote_code: true
  use_fast: true

runtime:
  max_seq_len: 1024
  attn_implementation: eager
