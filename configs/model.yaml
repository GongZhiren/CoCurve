models:
  llama-3.2-3b:
    hf_id: meta-llama/Llama-3.2-3B
    family: llama
    torch_dtype: bfloat16
    device_map: auto
  falcon3-7b:
    hf_id: tiiuae/Falcon3-7B-Base
    family: llama
    torch_dtype: bfloat16
    device_map: auto
  llama-3.1-8b-instruct:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    family: llama
    torch_dtype: bfloat16
    device_map: auto
  mistral-nemo-12b:
    hf_id: mistralai/Mistral-Nemo-Base-2407
    family: llama
    torch_dtype: bfloat16
    device_map: auto
  mistral-small-24b:
    hf_id: mistralai/Mistral-Small-24B-Base-2501
    family: llama
    torch_dtype: bfloat16
    device_map: auto
    tokenizer_kwargs:
      fix_mistral_regex: true
  llama-3.1-70b-instruct:
    hf_id: meta-llama/Llama-3.1-70B-Instruct
    family: llama
    torch_dtype: bfloat16
    device_map: auto
    load_in_4bit: true
