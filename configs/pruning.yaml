units:
  ffn_groups_per_layer: 16
  attention_group_mode: kv_aligned
  cost_type: params

matrix:
  h_storage_dtype: float32
  symmetrize: true
  assert_non_negative_diagonal: true
  min_diag_tolerance: -1.0e-8

solver:
  prune_ratio: 0.2
  allow_budget_overshoot: true
  interaction_mode: signed
  normalize_by_cost: true
  # Paper default at rho=0.20. For another ratio rho, set this to 1.5*rho.
  max_pruned_cost_fraction_per_layer: 0.30
  # Protect the first and last two Transformer layers, as in the paper.
  protect_first_layers: 2
  protect_last_layers: 2
  # Publication value for the default 8B model at rho=0.20. Every model/ratio
  # selects its own coordinate by held-out teacher KL via scripts/select_lambda.py.
  interaction_strength: 0.0108

physical_prune:
  enabled: true
  save_pruned_model: false

ablation_acceleration:
  enable_layer_replay: false
